services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextar
      POSTGRES_USER: nextar
      POSTGRES_PASSWORD: nextar
    ports: ["5432:5432"]
    volumes: [nextar-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextar -d nextar"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://nextar:nextar@db:5432/nextar?sslmode=disable
      PORT: "8080"
      WEB_ORIGIN: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  nextar-data:
